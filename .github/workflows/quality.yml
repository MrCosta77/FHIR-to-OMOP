name: Quality gates

on:
  push:
  pull_request:

jobs:
  contracts-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m src.quality.release_metadata
      - run: python -m src.utils.config
      - run: python -m pip install ruff
      - run: ruff check .
      - run: python -m pytest -m "not integration" -v
      - name: Build and smoke-test isolated wheel
        shell: bash
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -m pip install "$RUNNER_TEMP"/wheelhouse/*.whl --no-deps --target "$RUNNER_TEMP/wheel-smoke"
          cd "$RUNNER_TEMP"
          python -I -c "import sys; sys.path.insert(0, sys.argv[1]); from src.utils.config import load_settings; from src.omop.cdm54 import load_table_specs; from src.security.privacy import load_policy; assert load_settings({}).profile == 'development'; assert len(load_table_specs()) == 39; assert load_policy()['schema_version'] == '1.0.0'" "$RUNNER_TEMP/wheel-smoke"
