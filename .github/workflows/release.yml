name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m src.quality.release_metadata --release
      - run: python -m pytest -m "not integration" -v
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "FHIR-to-OMOP ${GITHUB_REF_NAME}"
