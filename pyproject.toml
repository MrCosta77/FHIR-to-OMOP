[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-to-omop"
version = "0.2.1"
description = "Clinical AI mapping framework from FHIR to OMOP"
authors = [
    {name = "Mario Costa", email = "mariocosta9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "chromadb==1.5.9",
    "ollama==0.6.2",
    "sentence-transformers==2.5.1",
    "pandas==3.0.5",
    "streamlit>=1.30.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]
